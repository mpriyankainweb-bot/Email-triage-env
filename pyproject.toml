[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-env"
version = "1.0.0"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "pyyaml>=6.0",
    "gradio>=4.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "inference:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.openenv]
name = "email-triage-env"
version = "1.0.0"
modes = ["easy", "medium", "hard"]
env_class = "environment.EmailTriageEnv"
entry_point = "inference"
